[workspace]
members = ["crates/anchor-detection-domain", "crates/danmu_stream", "crates/knowledge", "crates/knowledge-store", "crates/knowledge-writer", "crates/master-builder", "crates/master-comparison", "crates/master-ingest", "crates/master-script", "crates/master-script-store", "crates/recorder", "crates/whisper-cpp-rs"]
resolver = "2"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "deny"
complexity = "deny"
style = "deny"
perf = "deny"

[package]
name = "bili-shadowreplay"
version = "2.20.0"
description = "BiliBili ShadowReplay"
authors = ["Xinrea"]
license = ""
repository = ""
edition = "2021"

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anchor-detection-domain = { path = "crates/anchor-detection-domain" }
danmu_stream = { path = "crates/danmu_stream" }
knowledge = { path = "crates/knowledge" }
knowledge-store = { path = "crates/knowledge-store" }
knowledge-writer = { path = "crates/knowledge-writer" }
master-script = { path = "crates/master-script" }
master-script-store = { path = "crates/master-script-store" }
master-ingest = { path = "crates/master-ingest" }
master-builder = { path = "crates/master-builder" }
master-comparison = { path = "crates/master-comparison" }
recorder = { path = "crates/recorder" }
serde_json = "1.0"
sha2 = "0.10"
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
tempfile = "3"
reqwest = { workspace = true}
# Matches tauri-plugin-updater so credential-bearing requests can reject redirects.
reqwest_012 = { package = "reqwest", version = "0.12" }
serde_derive = "1.0.158"
serde = "1.0.158"
sysinfo = "0.32.0"
m3u8-rs = "5.0.3"
async-std = "1.12.0"
async-ffmpeg-sidecar = "0.0.1"
chrono = { version = "0.4.24", features = ["serde"] }
toml = "0.7.3"
regex = "1.7.3"
tokio = { version = "1.27.0", features = ["process", "io-util"] }
platform-dirs = "0.3.0"
pct-str = "1.2.0"
md5 = "0.7.0"
hyper = { version = "0.14", features = ["full"] }
dashmap = "6.1.0"
urlencoding = "2.1.3"
log = "0.4.22"
simplelog = "0.12.2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
rand = "0.8.5"
base64 = "0.21"
mime_guess = "2.0"
open = "5"
async-trait = "0.1.87"
whisper-cpp-rs = { path = "crates/whisper-cpp-rs", optional = true }
hound = "3.5.1"
uuid = { workspace = true }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
futures-core = "0.3"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
clap = { version = "4.5.37", features = ["derive"] }
url = "2.5.4"
srtparse = "0.2.0"
thiserror = "2"
deno_core = "0.355"
sanitize-filename = "0.6.0"
socketioxide = "0.17.2"
scraper = "0.24.0"
sentry = { version = "0.46.0", features = ["log", "logs"] }
calamine = "0.26"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
webview2-com = { version = "0.38", optional = true }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
local-whisper = ["dep:whisper-cpp-rs"]
cuda = ["local-whisper", "whisper-cpp-rs/cuda"]
headless = []
default = ["gui", "local-whisper"]
gui = [
    "tauri",
    "tauri-plugin-single-instance",
    "tauri-plugin-dialog",
    "tauri-plugin-shell",
    "tauri-plugin-fs",
    "tauri-plugin-http",
    "tauri-plugin-sql",
    "tauri-utils",
    "tauri-plugin-os",
    "tauri-plugin-notification",
    "tauri-plugin-deep-link",
    "tauri-plugin-updater",
    "fix-path-env",
    "webview2-com",
    "tauri-build",
]

[dependencies.tauri]
version = "2"
features = ["protocol-asset", "tray-icon", "unstable"]
optional = true

[dependencies.tauri-plugin-single-instance]
version = "2"
optional = true
features = ["deep-link"]

[dependencies.tauri-plugin-dialog]
version = "2"
optional = true

[dependencies.tauri-plugin-shell]
version = "2"
optional = true

[dependencies.tauri-plugin-fs]
version = "2"
optional = true

[dependencies.tauri-plugin-http]
version = "2"
optional = true

[dependencies.tauri-plugin-sql]
version = "2"
optional = true
features = ["sqlite"]

[dependencies.tauri-utils]
version = "2"
optional = true

[dependencies.tauri-plugin-os]
version = "2"
optional = true

[dependencies.tauri-plugin-notification]
version = "2"
optional = true

[dependencies.tauri-plugin-deep-link]
version = "2"
optional = true

[dependencies.tauri-plugin-updater]
version = "2.6.1"
optional = true

[dependencies.fix-path-env]
git = "https://github.com/tauri-apps/fix-path-env-rs"
optional = true

[build-dependencies.tauri-build]
version = "2"
features = []
optional = true

[dev-dependencies]
tempfile = "3"

[[test]]
name = "private_distribution"
path = "src/private_distribution/mod.rs"


[workspace.dependencies]
reqwest = { version = "0.11", features = ["blocking", "json", "multipart", "gzip"] }
uuid = { version = "1.4", features = ["v4"] }

[profile.release]
debug = 1
