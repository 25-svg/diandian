[package]
name = "knowledge-store"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
knowledge = { path = "../knowledge" }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
